version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: satya-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: satya-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=satya_ai
      - JWT_SECRET=change_me_in_production
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: satya-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
